default_index: 000300.SH
cache_enabled: true
cache_ttl: 3600
max_retries: 3

# 数据提供者列表
providers:
- id: akshare
  name: AKShare
  type: 免费开源
  description: 完全免费、无调用限制的数据源（推荐）
  status: passed
  adapter_module: core.data.providers.akshare_provider
  adapter_class: AKShareDataProvider
  markets:
  - CN
  requires_auth: false
  use_proxy: false  # 代理配置
  rate_limit: 无限制
  features:
  - 实时数据
  - 历史数据
  - 基本面数据
  - 宏观数据
  installation: pip install akshare
  last_test: '2025-12-09T08:43:19.749738'
  supports_period: false  # 不支持直接查询周线/月线，需要从日线转换
- id: yahoo
  name: Yahoo Finance
  type: 商业API
  description: 全球市场数据源
  status: passed
  adapter_module: core.data.providers.yahoo_provider
  adapter_class: YahooFinanceDataProvider
  markets:
  - HK
  - US
  - EU
  - JP
  - SG
  requires_auth: false
  use_proxy: false  # 代理配置
  rate_limit: 2000次/小时（可能限流）
  features:
  - 实时数据
  - 历史数据
  - 期权数据
  installation: pip install yfinance
  last_test: '2025-12-12T00:06:49.701765'
  supports_period: true  # 支持直接查询周线/月线
- id: tushare
